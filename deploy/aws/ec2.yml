AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated Ubuntu EC2 origin with an Elastic IP for Holonet or Archon.
Parameters:
  App:
    Type: String
    AllowedValues: [holonet, archon]
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  AdminCidr:
    Type: String
    Description: Operator IPv4 CIDR, for example 203.0.113.10/32.
    AllowedPattern: '([0-9]{1,3}\.){3}[0-9]{1,3}/([1-9]|[12][0-9]|3[0-2])'
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, t3.xlarge, t3.2xlarge, c7i-flex.large, m7i-flex.large]
  DiskGiB:
    Type: Number
    Default: 60
    MinValue: 30
  UbuntuAmi:
    Type: AWS::EC2::Image::Id
    Description: Pinned Canonical Ubuntu 24.04 amd64 AMI for this stack.

Conditions:
  UsesCpuCredits: !Equals [!Select [0, !Split ['.', !Ref InstanceType]], t3]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.86.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Ref AWS::StackName}]
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Gateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.86.0.0/24
  Routes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref Routes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Gateway
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref Routes
      SubnetId: !Ref Subnet
  Firewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref Vpc
      GroupDescription: Public HTTP and HTTPS, operator SSH
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  Origin:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref Firewall]
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
        InstanceMetadataTags: disabled
      CreditSpecification: !If
        - UsesCpuCredits
        - CPUCredits: standard
        - !Ref AWS::NoValue
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref DiskGiB
            Encrypted: true
            DeleteOnTermination: false
      Tags: [{Key: Name, Value: !Ref App}]
  Address:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
  AddressAssociation:
    Type: AWS::EC2::EIPAssociation
    DependsOn: [PublicRoute, SubnetRoutes]
    Properties:
      AllocationId: !GetAtt Address.AllocationId
      InstanceId: !Ref Origin

Outputs:
  PublicIp:
    Value: !Ref Address
  InstanceId:
    Value: !Ref Origin
  SshTarget:
    Value: !Sub 'ubuntu@${Address}'
