map "$request_method:$uri" $archon_operator_realm {
    default "Archon operator";
    ~^(GET|HEAD):/(docs|demo|login|signup|setup|dashboard|dashboard/architect)?/?$ off;
    ~^(GET|HEAD):/(_next/static/.*|favicon\.ico|icon[^/]*\.(png|svg)|apple-icon\.png|placeholder[^/]*\.(svg|png|jpg))$ off;
    ~^(GET|HEAD):/backend/auth/github(/callback)?/?$ off;
    ~^(GET|HEAD):/api/(auth/(github|session)|org/status|projects)/?$ off;
    "POST:/api/auth/logout" off;
    "POST:/api/org/validate-code" off;
}

server {
    listen 80;
    server_name @APP_HOST@;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name @APP_HOST@;
    ssl_certificate /etc/letsencrypt/live/archon-production/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archon-production/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic $archon_operator_realm;
    auth_basic_user_file /etc/archon-deploy/operators;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_read_timeout 600s;
    client_max_body_size 32m;

    location = /api/v1/webhook/github {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }

    location /backend/ {
        proxy_pass http://127.0.0.1:5555/;
    }

    location /agent/ {
        proxy_pass http://127.0.0.1:8000/;
    }

    location / {
        proxy_pass http://127.0.0.1:3100/;
    }
}
